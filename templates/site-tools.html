<dialog class="tool-dialog " id="tool-music" aria-labelledby="tool-title-music"><div class="tool-heading"><h2 id="tool-title-music">音乐</h2><button type="button" class="tool-close" data-tool-close aria-label="关闭音乐">✕</button></div><article class="rail-widget rail-widget--music" data-widget="music" data-status="idle" aria-label="音乐播放器">
          <header class="rail-widget__header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span class="rail-widget__title">音乐</span>
            <button type="button" class="music-lyrics-toggle" data-music-lyrics-toggle aria-label="显示/隐藏歌词" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="6" width="18" height="12" rx="2" ry="2"></rect>
                <line x1="7"  y1="11" x2="13" y2="11"></line>
                <line x1="7"  y1="15" x2="17" y2="15"></line>
              </svg>
            </button>
          </header>

          <div class="rail-widget__body">
            <!-- 当前曲目信息行 -->
            <div class="music-row">
              <div class="music-cover" data-music-cover aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9 18V5l12-2v13"></path>
                  <circle cx="6" cy="18" r="3"></circle>
                  <circle cx="18" cy="16" r="3"></circle>
                </svg>
              </div>
              <div class="music-meta">
                <span class="music-title"  data-music-title>未播放</span>
                <span class="music-artist" data-music-artist>—</span>
              </div>
            </div>

            <!-- 歌词区(toggle 控制,持久化) -->
            <div class="music-lyrics" data-music-lyrics hidden>
              <div class="music-lyrics__inner" data-music-lyrics-inner>
                <p class="music-lyrics__hint">暂无歌词</p>
              </div>
            </div>

            <!-- 进度条(可点击 seek) -->
            <div class="music-progress" data-music-progress role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="music-progress__bar" data-music-progress-bar></div>
            </div>
            <div class="music-time">
              <span data-music-time-current>0:00</span>
              <span data-music-time-total>0:00</span>
            </div>

            <!-- 5 个控件:loop / prev / play / next / playlist -->
            <div class="music-controls">
              <button type="button" class="music-btn" data-music-act="loop" data-loop-mode="sequential" aria-label="循环模式:顺序播放">
                <!-- 顺序播放 -->
                <svg class="music-icon-loop-sequential" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="4" y1="8" x2="17" y2="8"></line>
                  <polyline points="13 4 17 8 13 12"></polyline>
                  <line x1="4" y1="16" x2="17" y2="16"></line>
                  <polyline points="13 12 17 16 13 20"></polyline>
                </svg>
                <!-- 随机播放 -->
                <svg class="music-icon-loop-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="16 3 21 3 21 8"></polyline>
                  <line x1="4" y1="20" x2="21" y2="3"></line>
                  <polyline points="21 16 21 21 16 21"></polyline>
                  <line x1="15" y1="15" x2="21" y2="21"></line>
                  <line x1="4" y1="4" x2="9" y2="9"></line>
                </svg>
                <!-- 单曲循环 -->
                <svg class="music-icon-loop-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="17 1 21 5 17 9"></polyline>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                  <polyline points="7 23 3 19 7 15"></polyline>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                  <text x="12" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" stroke="none">1</text>
                </svg>
              </button>

              <button type="button" class="music-btn" data-music-act="prev" disabled aria-label="上一首">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="19 20 9 12 19 4 19 20"></polygon>
                  <rect x="4" y="5" width="2" height="14" rx="0.5"></rect>
                </svg>
              </button>

              <button type="button" class="music-btn music-btn--play" data-music-act="play" disabled aria-label="播放">
                <svg class="music-icon-play"  viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
                  <polygon points="6 4 20 12 6 20 6 4"></polygon>
                </svg>
                <svg class="music-icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
                  <rect x="6"  y="4" width="4" height="16" rx="1"></rect>
                  <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                </svg>
              </button>

              <button type="button" class="music-btn" data-music-act="next" disabled aria-label="下一首">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="5 4 15 12 5 20 5 4"></polygon>
                  <rect x="18" y="5" width="2" height="14" rx="0.5"></rect>
                </svg>
              </button>

              <button type="button" class="music-btn" data-music-act="playlist" aria-label="打开歌单">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="8"  y1="6"  x2="21" y2="6"></line>
                  <line x1="8"  y1="12" x2="21" y2="12"></line>
                  <line x1="8"  y1="18" x2="21" y2="18"></line>
                  <circle cx="3.5" cy="6"  r="1.2" fill="currentColor"></circle>
                  <circle cx="3.5" cy="12" r="1.2" fill="currentColor"></circle>
                  <circle cx="3.5" cy="18" r="1.2" fill="currentColor"></circle>
                </svg>
              </button>
            </div>
          </div>
        </article></dialog>
<dialog class="tool-dialog " id="tool-timer" aria-labelledby="tool-title-timer"><div class="tool-heading"><h2 id="tool-title-timer">计时</h2><button type="button" class="tool-close" data-tool-close aria-label="关闭计时">✕</button></div><article class="rail-widget rail-widget--timer" data-widget="timer" data-status="idle" aria-label="专注计时器">
          <header class="rail-widget__header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="10" y1="2" x2="14" y2="2"></line>
              <line x1="12" y1="14" x2="15" y2="11"></line>
              <circle cx="12" cy="14" r="8"></circle>
            </svg>
            <span class="rail-widget__title">专注</span>
            <span class="timer-today" data-timer-today aria-label="今日累计专注时长">今日 0m</span>
          </header>
          <div class="rail-widget__body">

            <!-- Tab 切换 -->
            <div class="timer-tabs" role="tablist">
              <button type="button" class="timer-tab is-active" role="tab" data-timer-tab="stopwatch" aria-selected="true">秒表</button>
              <button type="button" class="timer-tab" role="tab" data-timer-tab="countdown" aria-selected="false">计时</button>
            </div>

            <!-- 显示器 -->
            <div class="timer-display" data-timer-display>00:00</div>

            <!-- 计时模式 slider(秒表模式隐藏) -->
            <div class="timer-slider-wrap" data-timer-slider-wrap hidden>
              <input type="range" class="timer-slider" data-timer-slider min="1" max="60" step="1" value="25" aria-label="计时时长(分钟)">
              <span class="timer-slider-value" data-timer-slider-value>25 min</span>
            </div>

            <!-- 进度条(仅计时模式 + 非 idle 时显示) -->
            <div class="timer-progress" data-timer-progress hidden>
              <div class="timer-progress__bar" data-timer-progress-bar></div>
            </div>

            <!-- 控制按钮 -->
            <div class="timer-controls">
              <button type="button" class="timer-btn timer-btn--primary" data-timer-act="start">开始</button>
              <button type="button" class="timer-btn" data-timer-act="pause" disabled>暂停</button>
              <button type="button" class="timer-btn timer-btn--reset" data-timer-act="reset" disabled aria-label="重置">
                <span class="timer-btn__hold" data-timer-hold aria-hidden="true"></span>
                <span class="timer-btn__label">重置</span>
              </button>
            </div>

          </div>
        </article></dialog>
<dialog class="tool-dialog " id="tool-calendar" aria-labelledby="tool-title-calendar"><div class="tool-heading"><h2 id="tool-title-calendar">日历</h2><button type="button" class="tool-close" data-tool-close aria-label="关闭日历">✕</button></div><article class="rail-widget rail-widget--calendar" data-widget="calendar" aria-label="月历">
          <header class="rail-widget__header">
            <svg class="rail-widget__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span class="rail-widget__title" data-cal-title>—</span>
            <div class="rail-widget__actions">
              <button type="button" class="rail-widget__btn" data-cal-prev aria-label="上一月">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
              <button type="button" class="rail-widget__btn rail-widget__btn--text" data-cal-today hidden>今</button>
              <button type="button" class="rail-widget__btn" data-cal-next aria-label="下一月">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
            </div>
          </header>
          <div class="rail-widget__body">
            <div class="cal-weekdays" aria-hidden="true">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="cal-grid" data-cal-grid></div>
          </div>
        </article></dialog>
<dialog class="tool-dialog " id="tool-search" aria-labelledby="tool-title-search"><div class="tool-heading"><h2 id="tool-title-search">搜索</h2><button type="button" class="tool-close" data-tool-close aria-label="关闭搜索">✕</button></div><div class="search-control"><div class="search-bar" role="search">
            <div class="search-input-wrap">
              <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="7"></circle>
                  <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
              </span>
              <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="搜索笔记、动漫、页面…"
                autocomplete="off"
              >
              <button id="search-clear" class="search-clear" type="button" title="清空">✕</button>
              <button id="search-btn" class="search-btn" type="button" aria-label="搜索">搜索</button>
            </div>
          </div></div></dialog>
<dialog class="tool-dialog " id="tool-theme" aria-labelledby="tool-title-theme"><div class="tool-heading"><h2 id="tool-title-theme">主题</h2><button type="button" class="tool-close" data-tool-close aria-label="关闭主题">✕</button></div><div class="theme-control"><div class="theme-panel" id="theme-panel">

            <label>模式</label>
            <div class="theme-mode-group" role="radiogroup" aria-label="主题模式">
              <button type="button" class="theme-mode-btn" data-mode="light"  title="明亮模式">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="4"></circle>
                  <line x1="12" y1="2"  x2="12" y2="4"></line>
                  <line x1="12" y1="20" x2="12" y2="22"></line>
                  <line x1="2"  y1="12" x2="4"  y2="12"></line>
                  <line x1="20" y1="12" x2="22" y2="12"></line>
                  <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"></line>
                  <line x1="17.7" y1="17.7" x2="19.1" y2="19.1"></line>
                  <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"></line>
                  <line x1="17.7" y1="6.3" x2="19.1" y2="4.9"></line>
                </svg>
                <span>明亮</span>
              </button>
              <button type="button" class="theme-mode-btn" data-mode="dark" title="黑暗模式">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
                </svg>
                <span>黑暗</span>
              </button>
              <button type="button" class="theme-mode-btn" data-mode="auto" title="跟随系统">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="13" rx="2"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span>跟随</span>
              </button>
            </div>

            <label>预设颜色</label>
            <div class="theme-presets" role="radiogroup" aria-label="预设主题色">
              <button type="button" class="theme-preset" data-hue="0"   title="红"></button>
              <button type="button" class="theme-preset" data-hue="20"  title="橙"></button>
              <button type="button" class="theme-preset" data-hue="45"  title="金"></button>
              <button type="button" class="theme-preset" data-hue="145" title="翠"></button>
              <button type="button" class="theme-preset" data-hue="180" title="青"></button>
              <button type="button" class="theme-preset" data-hue="210" title="蓝"></button>
              <button type="button" class="theme-preset" data-hue="260" title="紫"></button>
              <button type="button" class="theme-preset" data-hue="330" title="粉"></button>
            </div>

            <label>自定义色相</label>
            <div class="hue-picker">
              <div
                class="hue-picker-track"
                id="hue-picker-track"
                role="slider"
                tabindex="0"
                aria-label="自定义色相"
                aria-valuemin="0"
                aria-valuemax="360"
                aria-valuenow="330"
              >
                <div class="hue-picker-thumb" id="hue-picker-thumb"></div>
              </div>
              <div class="hue-picker-value" id="hue-picker-value">330</div>
            </div>
            <input type="range" id="hue-slider" min="0" max="360" value="330" hidden>

            <button id="glow-toggle" class="theme-glow-toggle" type="button" aria-pressed="true" title="切换背景光晕">
              <span class="theme-glow-label">背景光晕</span>
              <span class="theme-glow-switch" aria-hidden="true">
                <span class="theme-glow-switch-thumb"></span>
              </span>
            </button>
          </div><button type="button" class="shell-settings-link" data-tool="settings">界面设置</button></div></dialog>
<dialog class="tool-dialog " id="tool-settings" aria-labelledby="tool-title-settings"><div class="tool-heading"><h2 id="tool-title-settings">设置</h2><button type="button" class="tool-close" data-tool-close aria-label="关闭设置">✕</button></div><label class="shell-setting"><input type="checkbox" data-pin-setting> 固定展开桌面侧栏</label><p>关闭后，鼠标悬停或键盘聚焦侧栏可临时展开。</p></dialog>
<div class="music-modal" data-music-modal hidden aria-hidden="true">
    <div class="music-modal__backdrop" data-music-modal-close></div>
    <div class="music-modal__panel" role="dialog" aria-modal="true" aria-label="歌单">
      <header class="music-modal__header">
        <h3 class="music-modal__title">歌单</h3>
        <div class="music-modal__search" role="search">
          <svg class="music-modal__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input class="music-modal__search-input" type="search" data-music-modal-search placeholder="搜索歌曲或歌手" aria-label="搜索歌单" autocomplete="off">
        </div>
        <span class="music-modal__count" data-music-modal-count>0 首</span>
        <button type="button" class="music-modal__close" data-music-modal-close aria-label="关闭歌单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="6"  y1="6"  x2="18" y2="18"></line>
            <line x1="18" y1="6"  x2="6"  y2="18"></line>
          </svg>
        </button>
      </header>
      <p class="music-modal__empty" data-music-modal-empty hidden>没有找到匹配的音乐</p>
      <ul class="music-modal__list" data-music-modal-list></ul>
    </div>
  </div>
<audio id="music-audio" preload="metadata" aria-hidden="true"></audio>
