<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站点更新日志</title>
</head>
<body>
<main id="main-content">
<section class="update-page no-card">

    <!-- =================================================
         Hero
         ================================================= -->
    <section class="update-hero">
      <div class="update-hero-text">
        <h1 class="update-hero-title">站点更新日志</h1>
        <p class="update-hero-subtitle">记录小站每一次功能迭代、界面调整与性能优化</p>

        <div class="update-hero-stats">
          <!-- 最近更新 -->
          <div class="update-stat-card">
            <span class="update-stat-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8"  y1="2" x2="8"  y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </span>
            <span class="update-stat-text">
              <span class="update-stat-label">最近更新</span>
              <span class="update-stat-value" data-stat="latest">—</span>
            </span>
          </div>

          <!-- 累计更新 -->
          <div class="update-stat-card">
            <span class="update-stat-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
            </span>
            <span class="update-stat-text">
              <span class="update-stat-label">累计更新</span>
              <span class="update-stat-value"><span data-stat="total">—</span> 条</span>
            </span>
          </div>

          <!-- 更新日历(按钮型) -->
          <button class="update-stat-card update-stat-card--button"
                  id="update-calendar-trigger"
                  type="button"
                  aria-haspopup="dialog"
                  aria-expanded="false"
                  aria-controls="update-calendar">
            <span class="update-stat-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8"  y1="2" x2="8"  y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <circle cx="8"  cy="14" r="1" fill="currentColor"></circle>
                <circle cx="12" cy="14" r="1" fill="currentColor"></circle>
                <circle cx="16" cy="14" r="1" fill="currentColor"></circle>
              </svg>
            </span>
            <span class="update-stat-text">
              <span class="update-stat-label">更新日历</span>
              <span class="update-stat-value">点击查看</span>
            </span>
            <span class="update-stat-chevron">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="4 6 8 10 12 6"></polyline>
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- 装饰环(currentColor 跟随主题,reduce-motion 时不旋转) -->
      <div class="update-hero-decoration" aria-hidden="true">
        <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="update-hero-orb-grad" cx="50%" cy="40%" r="60%">
              <stop offset="0%"   stop-color="currentColor" stop-opacity="0.85"/>
              <stop offset="60%"  stop-color="currentColor" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="update-hero-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="currentColor" stop-opacity="0.0"/>
              <stop offset="50%"  stop-color="currentColor" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="currentColor" stop-opacity="0.0"/>
            </linearGradient>
          </defs>

          <!-- 主环 -->
          <g class="update-hero-ring--main" transform-origin="160 160">
            <ellipse cx="160" cy="160" rx="120" ry="120"
                     fill="none" stroke="url(#update-hero-ring-grad)" stroke-width="2"/>
            <ellipse cx="160" cy="160" rx="120" ry="42"
                     fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.32"/>
          </g>

          <!-- 副环(反向旋转) -->
          <g class="update-hero-ring--accent" transform-origin="160 160">
            <ellipse cx="160" cy="160" rx="80" ry="80"
                     fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.22"/>
            <ellipse cx="160" cy="160" rx="80" ry="32" transform="rotate(35 160 160)"
                     fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.5"/>
          </g>

          <!-- 中心球 -->
          <circle class="update-hero-orb" cx="160" cy="160" r="46" fill="url(#update-hero-orb-grad)"/>
          <circle cx="160" cy="160" r="22" fill="currentColor" fill-opacity="0.62"/>

          <!-- 漂浮粒子 -->
          <circle class="update-hero-particle" cx="62"  cy="120" r="3.5" fill="currentColor" fill-opacity="0.7"/>
          <circle class="update-hero-particle" cx="270" cy="110" r="2.5" fill="currentColor" fill-opacity="0.55" style="animation-delay: -1.2s;"/>
          <circle class="update-hero-particle" cx="240" cy="240" r="3"   fill="currentColor" fill-opacity="0.65" style="animation-delay: -2s;"/>
          <circle class="update-hero-particle" cx="80"  cy="220" r="2"   fill="currentColor" fill-opacity="0.5"  style="animation-delay: -0.6s;"/>
        </svg>
      </div>
    </section>

    <!-- =================================================
         筛选 + 排序
         ================================================= -->
    <div class="update-filterbar">
      <div class="update-chips" data-update-chips role="tablist" aria-label="按类型筛选更新">
        <button class="update-chip is-active" type="button" data-chip="all" role="tab" aria-selected="true">全部</button>
        <button class="update-chip" type="button" data-chip="feature" role="tab" aria-selected="false">功能更新</button>
        <button class="update-chip" type="button" data-chip="visual"  role="tab" aria-selected="false">视觉优化</button>
        <button class="update-chip" type="button" data-chip="perf"    role="tab" aria-selected="false">性能优化</button>
        <button class="update-chip" type="button" data-chip="fix"     role="tab" aria-selected="false">修复问题</button>
        <button class="update-chip" type="button" data-chip="mobile"  role="tab" aria-selected="false">移动端适配</button>
      </div>

      <button class="update-sort"
              id="update-sort-toggle"
              type="button"
              data-sort="newest"
              aria-label="当前为最新优先，点击切换为最早优先">
        <svg class="update-sort-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">
          <path d="M4 6h16"></path>
          <path d="M7 11h13"></path>
          <path d="M10 16h10"></path>
          <path d="M13 21h7"></path>
        </svg>
        <span class="update-sort-text">最新优先</span>
      </button>
    </div>

    <!-- =================================================
         Timeline 列表(JS 渲染:月份 header + 卡片)
         ================================================= -->
    <div class="update-timeline" id="update-list"></div>

    <!-- =================================================
         更新日历 popover / sheet
         ================================================= -->
    <div class="update-calendar-backdrop" id="update-calendar-backdrop" hidden></div>

    <div class="update-calendar"
         id="update-calendar"
         hidden
         role="dialog"
         aria-label="更新日历"
         aria-modal="false">
      <div class="update-calendar-header">
        <button class="update-calendar-nav" type="button"
                data-calendar-nav="prev" aria-label="上个月">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="10 4 6 8 10 12"></polyline>
          </svg>
        </button>
        <span class="update-calendar-title" data-calendar-title>—</span>
        <button class="update-calendar-nav" type="button"
                data-calendar-nav="next" aria-label="下个月">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 4 10 8 6 12"></polyline>
          </svg>
        </button>
      </div>

      <div class="update-calendar-weekdays" aria-hidden="true">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>

      <div class="update-calendar-grid" data-calendar-grid></div>

      <div class="update-calendar-hint">
        <span class="update-calendar-hint-dot" aria-hidden="true"></span>
        <span>有更新的日子可点击,跳转到对应卡片</span>
      </div>
    </div>

  </section>
</main>

</body>
</html>
