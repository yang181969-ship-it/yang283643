  <!-- Nav 折叠态初始化(Phase 3):同步内联,防闪烁
       读 localStorage.navCollapsed,无值默认 "true"(首次访问折叠);
       写 data-nav 到 <html>,CSS 的 html[data-nav="collapsed"] 立即生效 -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem('navCollapsed');
        var collapsed = (v === null) ? true : (v === 'true');
        document.documentElement.setAttribute('data-nav', collapsed ? 'collapsed' : 'expanded');
      } catch (e) {
        document.documentElement.setAttribute('data-nav', 'collapsed');
      }
    })();

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 6 9 12 15 18"></polyline>
      </svg>
    </button>
    <button id="back-to-top" title="返回顶部" aria-label="返回顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 15 12 9 18 15"></polyline>
      </svg>
    </button>
  </div>

  <!-- 手机搜索浮层遮罩 -->
  <div id="search-backdrop" class="search-backdrop"></div>

  <!-- 业务 JS -->
  <script defer src="../js/main.js"></script>
  <script defer src="../js/anime-data.js"></script>
  <script defer src="../js/anime-detail.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/calendar-widget.js"></script>
  <script defer src="../js/focus-timer.js"></script>
  <script defer src="../js/music-player.js"></script>
  <script defer src="../js/mobile-activity-island.js"></script>
  <script defer src="../js/rail-extras-swipe.js"></script>

  <div class="music-modal" data-music-modal hidden aria-hidden="true">
    <div class="music-modal__backdrop" data-music-modal-close></div>
    <div class="music-modal__panel" role="dialog" aria-modal="true" aria-label="歌单">
      <header class="music-modal__header">
        <h3 class="music-modal__title">歌单</h3>
        <div class="music-modal__search" role="search">
          <svg class="music-modal__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input class="music-modal__search-input" type="search" data-music-modal-search placeholder="搜索歌曲或歌手" aria-label="搜索歌单" autocomplete="off">
        </div>
        <span class="music-modal__count" data-music-modal-count>0 首</span>
        <button type="button" class="music-modal__close" data-music-modal-close aria-label="关闭歌单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="6"  y1="6"  x2="18" y2="18"></line>
            <line x1="18" y1="6"  x2="6"  y2="18"></line>
          </svg>
        </button>
      </header>
      <p class="music-modal__empty" data-music-modal-empty hidden>没有找到匹配的音乐</p>
      <ul class="music-modal__list" data-music-modal-list></ul>
    </div>
  </div>
  
  <!-- 浮动按钮：始终显示 + 点击跳转 -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btnTop  = document.getElementById("back-to-top");
      const btnPrev = document.getElementById("back-to-prev");
      const scroller = document.querySelector(".content-scroll");

      // 始终显示，不再监听滚动距离
      // (如果以后想恢复"滚动后显示"，把下面注释打开即可)
      // if (scroller) {
      //   scroller.addEventListener("scroll", () => {
      //     document.getElementById("floating-btns")
      //       .classList.toggle("show", scroller.scrollTop > 300);
      //   });
      // }

      btnTop?.addEventListener("click", () => {
        scroller?.scrollTo({ top: 0, behavior: "smooth" });
      });

      btnPrev?.addEventListener("click", () => history.back());
    });
  </script>
</body>
</html>
